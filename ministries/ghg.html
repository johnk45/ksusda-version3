<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Zion Hero Premium</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ================= ROOT ================= */
:root{
    --primary:#1e40af;
    --secondary:#3b82f6;
    --dark:#0f172a;
    --text:#cbd5e1;
}

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

/* ================= NAVBAR ================= */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:16px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;

    background:rgba(15,23,42,.35);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.navbar h2{
    color:white;
    font-weight:800;
    letter-spacing:1px;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:500;
    transition:.3s;
    opacity:.85;
}

.navbar a:hover{
    opacity:1;
    color:#60a5fa;
}

/* ================= HERO ================= */
.hero{
    height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:white;
}

/* BACKGROUND VIDEO */
.hero video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.45) saturate(1.2);
}

/* IMAGE FALLBACK */
.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:url('https://images.unsplash.com/photo-1520975916090-3105956dac38')
    center/cover no-repeat;
    filter:brightness(.45);
    z-index:-2;
}

/* OVERLAY */
.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at top,
    rgba(59,130,246,.25),
    transparent 50%),
    linear-gradient(135deg,
    rgba(15,23,42,.88),
    rgba(30,64,175,.55),
    rgba(6,182,212,.25));
}

/* ================= HERO CONTENT ================= */
.hero-content{
    position:relative;
    text-align:center;
    max-width:900px;
    padding:20px;
    z-index:2;
}

/* BADGE */
.badge{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:10px 18px;
    border-radius:50px;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(12px);

    margin-bottom:20px;
    font-size:.9rem;
}

/* TITLE */
.hero h1{
    font-size:4rem;
    font-weight:900;
    line-height:1.05;

    animation:fadeUp 1s ease;
}

.hero h1 span{
    background:linear-gradient(90deg,#60a5fa,#22d3ee);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* TEXT */
.hero p{
    margin:20px auto 30px;
    font-size:1.15rem;
    color:var(--text);
    max-width:700px;

    animation:fadeUp 1.2s ease;
}

/* BUTTONS */
.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    animation:fadeUp 1.4s ease;
}

.btn{
    padding:14px 28px;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(37,99,235,.4);
}

.btn-outline{
    border:1px solid rgba(255,255,255,.4);
    color:white;
}

.btn-outline:hover{
    background:white;
    color:#1e40af;
}

/* ================= STATS ================= */
.stats{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.stat{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    padding:18px 22px;
    border-radius:16px;
    min-width:120px;
    transition:.3s;
}

.stat:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.12);
}

.stat h3{
    font-size:1.8rem;
    color:#60a5fa;
}

.stat p{
    font-size:.85rem;
    color:#cbd5e1;
}

/* ================= FLOATING CARD ================= */
.info-card{
    position:absolute;
    bottom:25px;
    right:25px;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(15px);
    padding:15px 20px;
    border-radius:18px;

    display:flex;
    align-items:center;
    gap:12px;

    animation:float 3s ease-in-out infinite;
}

/* ================= SCROLL ================= */
.scroll{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:white;
    opacity:.8;
    animation:bounce 2s infinite;
}

/* ================= ANIMATIONS ================= */
@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(25px);}
    to{opacity:1; transform:translateY(0);}
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){

    .hero h1{
        font-size:2.6rem;
    }

    .hero p{
        font-size:1rem;
    }

    .stats{
        gap:12px;
    }

    .stat{
        padding:14px 16px;
    }

    .info-card{
        display:none;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>New Zion</h2>
    <div>
        <a href="#">Home</a>
        <a href="#about">About</a>
        <a href="#join">Join</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">

<video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-church-worship-1579/1080p.mp4">
</video>

<div class="hero-content">

<div class="badge">
<i class="fas fa-church"></i>
Kisii University SDA Ministry
</div>

<h1>
A Community Where <span>Faith Comes Alive</span>
</h1>

<p>
Grow spiritually, build leadership, and experience true Christian fellowship in a vibrant campus ministry.
</p>

<div class="hero-buttons">
<a href="#" class="btn btn-primary">Join Us</a>
<a href="#about" class="btn btn-outline">Learn More</a>
</div>


<!-- FLOATING CARD -->
<div class="info-card">
<i class="fas fa-praying-hands"></i>
<div>Weekly Worship</div>
</div>

<!-- SCROLL -->
<div class="scroll">
<i class="fas fa-angle-down"></i>
<p>Scroll</p>
</div>

</section>

</body>
</html>
